<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerador CRUD - FastAPI & JS</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f1f5f9; color: #1e293b; max-width: 900px; margin: 30px auto; padding: 0 16px; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    input { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; }
    button { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #2563eb; color: #fff; }
    button:hover { background: #1d4ed8; }
    button.sec { background: #0f766e; }
    button.copy { background: #475569; margin-top: 8px; }
    textarea { width: 100%; height: 380px; font-family: monospace; font-size: 13px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; background: #0f172a; color: #e2e8f0; }
    .links { margin-top: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Gerador de CRUD (Python + JS)</h2>
    <div class="row">
      <input id="tabela" type="text" placeholder="Digite o nome da tabela (ex: destinatario, produtos)" />
      <button onclick="gerar('gerar-crud-python')">Gerar Python (.py)</button>
      <button class="sec" onclick="gerar('gerar-crud-js')">Gerar Frontend (.js)</button>
    </div>

    <textarea id="resultado" placeholder="O código gerado aparecerá aqui..."></textarea>
    <button class="copy" onclick="copiar()">Copiar Código</button>

    <div class="links">
      <a href="/docs" target="_blank">Abrir Swagger UI (/docs)</a>
    </div>
  </div>

  <script>
    async function gerar(rota) {
      const tabela = document.getElementById("tabela").value.trim();
      const out = document.getElementById("resultado");
      if (!tabela) return alert("Informe o nome da tabela.");

      out.value = "Gerando código...";
      try {
        const resp = await fetch(`/api/v1/dev/${rota}/${tabela}`);
        const texto = await resp.text();
        if (!resp.ok) throw new Error(texto);
        out.value = texto;
      } catch (err) {
        out.value = "Erro: " + err.message;
      }
    }

    function copiar() {
      const out = document.getElementById("resultado");
      if (!out.value) return;
      navigator.clipboard.writeText(out.value);
      alert("Código copiado para a área de transferência!");
    }
  </script>
</body>
</html>
