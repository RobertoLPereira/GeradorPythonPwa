name: Gerar EXE Windows

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Dispara também quando você criar uma versão (ex: v1.0.0)

# Permissão necessária para o Actions criar a Release no repositório
permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar arquivo .exe
        run: |
          pyinstaller --onefile --noupx --name "GeradorCRUD" --icon="frontend/favicon.ico" --add-data "frontend;frontend" --paths "." backend/apis/main.py

      - name: Disponibilizar .exe nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeradorCRUD-Windows
          path: dist/GeradorCRUD.exe

      - name: Publicar na aba Releases (apenas quando houver tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GeradorCRUD.exe
          generate_release_notes: true
