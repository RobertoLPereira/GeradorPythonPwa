name: Gerar EXE Windows

on:
  push:
    branches: [ "main" ]

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar arquivo .exe
        run: |
          pyinstaller --onefile --name "GeradorCRUD" --icon="frontend/favicon.ico" --add-data "frontend;frontend" --paths "." backend/apis/main.py

      - name: Disponibilizar .exe para download
        uses: actions/upload-artifact@v4
        with:
          name: GeradorCRUD-Windows
          path: dist/GeradorCRUD.exe
